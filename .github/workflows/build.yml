name: Build MyOS Kernel

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-multilib \
          g++-multilib \
          xorriso \
          grub-pc-bin \
          grub-common \
          qemu-system-x86 \
          nasm \
          mtools \
          dosfstools

    - name: Install i386-elf toolchain from official source
      run: |
        # Download pre-built i386-elf toolchain from reliable source
        wget -q https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
        unzip -q i686-elf-tools-linux.zip -d /tmp/i686-elf-tools
        sudo cp /tmp/i686-elf-tools/bin/* /usr/local/bin/
        rm -rf /tmp/i686-elf-tools i686-elf-tools-linux.zip

    - name: Verify toolchain
      run: |
        i386-elf-g++ --version
        i386-elf-ld --version
        which i386-elf-g++

    - name: Build kernel
      run: |
        make clean
        make all

    - name: Build ISO image
      run: |
        make iso

    - name: Build floppy image
      run: |
        make floppy

    - name: Test with QEMU (smoke test)
      run: |
        # Run QEMU for 3 seconds to check if kernel boots
        timeout 3s qemu-system-i386 -kernel kernel.elf -nographic -no-reboot || exit 0
        echo "Kernel boot test passed"

    - name: Upload artifacts (kernel ELF)
      uses: actions/upload-artifact@v4
      with:
        name: kernel-elf
        path: kernel.elf
        if-no-files-found: error

    - name: Upload artifacts (ISO)
      uses: actions/upload-artifact@v4
      with:
        name: myos-iso
        path: myos.iso
        if-no-files-found: error

    - name: Upload artifacts (Floppy)
      uses: actions/upload-artifact@v4
      with:
        name: myos-floppy
        path: myos.flp
        if-no-files-found: error

  # Create release when tag is pushed
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create release with assets
      uses: softprops/action-gh-release@v1
      with:
        name: MyOS ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          artifacts/kernel-elf/kernel.elf
          artifacts/myos-iso/myos.iso
          artifacts/myos-floppy/myos.flp
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Alternative: Build using Docker with full toolchain
  build-docker:
    runs-on: ubuntu-latest
    if: false  # Disable by default, can be enabled if needed
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build with Docker
      run: |
        docker run --rm -v $PWD:/build -w /build \
          i386/ubuntu:22.04 bash -c "
            apt-get update && apt-get install -y \
              build-essential gcc-multilib g++-multilib \
              xorriso grub-pc-bin grub-common nasm mtools dosfstools
            wget -q https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
            unzip -q i686-elf-tools-linux.zip
            export PATH=\$PATH:\$PWD/i686-elf-tools/bin
            make clean && make all && make iso && make floppy
          "

    - name: Upload artifacts from Docker build
      uses: actions/upload-artifact@v4
      with:
        name: kernel-elf-docker
        path: kernel.elf
