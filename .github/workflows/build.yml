name: Build MyOS Kernel

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'  # Trigger on version tags
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

env:
  # Use i386-elf toolchain
  CXX: i386-elf-g++
  LD: i386-elf-ld
  OBJCOPY: i386-elf-objcopy

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-multilib \
          g++-multilib \
          xorriso \
          grub-pc-bin \
          grub-common \
          qemu-system-x86 \
          nasm
        # Install i386-elf toolchain
        wget https://github.com/loongson-community/loongarch-toolchain/releases/download/20220620/loongarch64-cross-tools-ubuntu20.04.tar.xz || true
        sudo apt-get install -y gcc-i386-linux-gnu g++-i386-linux-gnu

    - name: Setup i386-elf toolchain (alternative)
      run: |
        # Install i386-elf toolchain from source
        wget https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/i686-elf-tools-linux.zip
        unzip i686-elf-tools-linux.zip -d /tmp/i686-elf-tools
        sudo cp /tmp/i686-elf-tools/bin/* /usr/local/bin/
        rm -rf /tmp/i686-elf-tools i686-elf-tools-linux.zip

    - name: Verify toolchain
      run: |
        i386-elf-g++ --version
        i386-elf-ld --version

    - name: Build kernel
      run: |
        make clean
        make all

    - name: Build ISO image
      run: |
        make iso

    - name: Build floppy image
      run: |
        make floppy

    - name: Test with QEMU (smoke test)
      run: |
        timeout 5s qemu-system-i386 -kernel kernel.elf -nographic -append "console=ttyS0" || true
        echo "QEMU test completed (timeout expected)"

    - name: Upload artifacts (kernel ELF)
      uses: actions/upload-artifact@v4
      with:
        name: kernel-elf
        path: kernel.elf
        if-no-files-found: error

    - name: Upload artifacts (ISO)
      uses: actions/upload-artifact@v4
      with:
        name: myos-iso
        path: myos.iso
        if-no-files-found: error

    - name: Upload artifacts (Floppy)
      uses: actions/upload-artifact@v4
      with:
        name: myos-floppy
        path: myos.flp
        if-no-files-found: error

  # Create release when tag is pushed
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # Required for creating releases
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        name: MyOS ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          artifacts/kernel-elf/kernel.elf
          artifacts/myos-iso/myos.iso
          artifacts/myos-floppy/myos.flp
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build for different platforms (cross-compile)
  build-multiplatform:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Build for 64-bit (x86_64)
      run: |
        echo "Building x86_64 version..."
        # Add x86_64 build logic here if needed

    - name: Upload multi-platform artifacts
      uses: actions/upload-artifact@v4
      with:
        name: myos-multiplatform
        path: |
          build-x86_64/
          build-i386/
